<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Selector</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #container {
            width: 300px;
            height: 200px;
            background-color: lightgray;
            margin: 50px auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 10px;
            cursor: pointer;
        }
        .color-box {
            width: 100px;
            height: 40px;
            margin: 5px;
            border: none;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .row {
            display: flex;
            justify-content: center;
        }

        .red { background-color: red; }
        .orange { background-color: orange; }
        .yellow { background-color: yellow; color: black; }
        .green { background-color: green; }
        .blue { background-color: blue; }
        .indigo { background-color: indigo; }
        .violet { background-color: violet; }
    </style>
</head>
<body>

    <h1>Color Selector</h1>
    <p>Click a color to change the background.</p>
    <div id="container">
        <div id="row">
            <button class="color-box red">Red</button>
            <button class="color-box blue">Orange</button>
            <button class="color-box green">Yellow</button>
        </div>
        <div id="row">
            <button class="color-box yellow">Green</button>
            <button class="color-box indigo">Blue</button>
            <button class="color-box orange">Indigo</button>
            <button class="color-box violet">Violet</button>
        </div>
        <div id="row">
        </div>
    </div>

    <h2>Selected Color: <span id="selected-color">None</span></h2>

<script>
    document.getElementById("container").addEventListener("click", function() {
        alert("You clicked the container!");
        this.style.backgroundColor = "lightgray";
    });

    document.querySelectorAll(".color-box").forEach(button => {
        button.addEventListener("click", function(event) {
            event.stopPropagation(); 

             document.querySelectorAll(".color-box").forEach(btn => btn.style.border = "none");
                this.style.border = "3px solid white";
                this.style.borderRadius = "5px";

                document.querySelector("body").style.backgroundColor = window.getComputedStyle(this).backgroundColor;
                document.getElementById("container").style.backgroundColor = window.getComputedStyle(this).backgroundColor;
                document.getElementById("selected-color").textContent = "Selected Color: " + this.textContent;
        });
    });
</script>
</body>
</html>
