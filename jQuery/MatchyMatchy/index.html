<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Matchy Matchy!</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="script.js"></script>
    </head>
    <body>
        <h1>Matchy Matchy!</h1>
        <main>

            <!-- Pair 1: Ace of Spades -->
            <img src="img/back.png" alt="card" data-alt-src="img/ace-spades.png">
            <img src="img/back.png" alt="card" data-alt-src="img/ace-spades.png">

            <!-- Pair 2: King of Hearts -->
            <img src="img/back.png" alt="card" data-alt-src="img/king-hearts.webp">
            <img src="img/back.png" alt="card" data-alt-src="img/king-hearts.webp">

            <!-- Pair 3: Queen of Diamonds -->
            <img src="img/back.png" alt="card" data-alt-src="img/queen-diamond.webp">
            <img src="img/back.png" alt="card" data-alt-src="img/queen-diamond.webp">

            <!-- Pair 4: Jack of Clubs -->
            <img src="img/back.png" alt="card" data-alt-src="img/jack-clubs.jpg">
            <img src="img/back.png" alt="card" data-alt-src="img/jack-clubs.jpg">

            <!-- Pair 5: 10 of Spades -->
            <img src="img/back.png" alt="card" data-alt-src="img/ten-spades.png">
            <img src="img/back.png" alt="card" data-alt-src="img/ten-spades.png">

            <!-- Pair 6: Joker -->
            <img src="img/back.png" alt="card" data-alt-src="img/joker.png">
            <img src="img/back.png" alt="card" data-alt-src="img/joker.png">
        </main>

        <button id="reset-btn">Reset</button>
    </body>
</html>
